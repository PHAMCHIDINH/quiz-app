<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phân Loại Màu Sắc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/1f5d1.svg" />
</head>

<body data-page="sort">
  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="page-shell">
    <main class="app-card sorting-app">
      <div class="quiz-header-row">
        <div>
          <h2>🧺 Phân Loại Màu Sắc</h2>
          <p class="quiz-meta" id="score-text">Đúng: 0 | Sai: 0</p>
        </div>
        <div class="quiz-header-actions">
          <a href="./index.html" class="ghost-button">🏠 Về trang chính</a>
        </div>
      </div>

      <div class="sorting-area">
        <div class="current-item-card" id="item-card">
          <p class="subtle-text">Hãy chọn thùng màu đúng cho:</p>
          <h3 id="reaction-text">Đang tải...</h3>
        </div>

        <div class="buckets-container" id="buckets-container">
          <!-- Buckets will be generated here -->
        </div>
      </div>

      <div class="footer-bar">
        <button class="button" id="restart-btn" style="width: 100%;">🔄 Bắt đầu lại</button>
      </div>
    </main>
  </div>

  <script type="module" src="./js/sort.js"></script>
</body>

</html>
